<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>OSG チーム・選手の名簿</title>
<!-- 事前にチームと選手を登録しておくページ。操作画面の入力候補として使われる。 -->
<meta name="description" content="テニス日本リーグ配信用スコアボードの、チームと選手の名簿。CSVで一括登録できます。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Noto+Sans+JP:wght@500;700;900&display=swap">
<link rel="stylesheet" href="css/ui.css">
<link rel="stylesheet" href="css/teams.css">
</head>
<body>

<div class="gate" id="gate" hidden>
  <form id="loginForm" autocomplete="on">
    <h2>チーム・選手の名簿</h2>
    <p class="note">配信チームのメールアドレスとパスワードでログインしてください。</p>
    <label>メールアドレス<input type="email" id="email" autocomplete="username" required></label>
    <label>パスワード<input type="password" id="pass" autocomplete="current-password" required></label>
    <p class="err" id="loginErr" role="alert"></p>
    <button class="primary" type="submit" id="loginBtn">ログイン</button>
  </form>
</div>

<div class="shell" id="app">

  <header class="top">
    <div class="brand">
      <span class="tally">LIVE</span>
      <h1>名簿</h1>
    </div>
    <span class="state" id="conn"><b></b><span>読み込み中…</span></span>
    <div class="row" style="flex:0 0 auto">
      <a class="btn-wrap" href="index.html"><button type="button" class="ghost">コート一覧へ</button></a>
      <button type="button" class="ghost" id="logout">ログアウト</button>
    </div>
  </header>

  <p class="lead">
    ここに登録しておくと、操作画面でチーム名や選手名を<b>打たずに選べる</b>ようになります。
    入力した内容は<b>その場で保存</b>されます。
  </p>

  <div class="layout">

    <!-- ============ 左：チーム一覧 ============ -->
    <section class="card side">
      <h2>Teams<span>チーム</span><span class="chip" id="teamCount"></span></h2>
      <div class="tlist" id="tlist"><p class="empty">読み込み中…</p></div>
      <button type="button" class="primary" id="addTeam">＋ チームを追加</button>
    </section>

    <!-- ============ 右：選んだチームの中身 ============ -->
    <div class="main">

      <section class="card" id="detail">
        <p class="empty">左の一覧からチームを選んでください。</p>
      </section>

      <section class="card">
        <h2>CSV<span>まとめて登録する</span></h2>
        <p class="note">
          Excel で表を作って CSV 形式で保存し、ここで読み込むと一括登録できます。
          列は左から <b>チーム名 / 選手名 / かな / 背番号</b> の順です（かなと背番号は空でもかまいません）。
        </p>
        <div class="row">
          <button type="button" class="ghost" id="sampleCsv">見本CSVをダウンロード</button>
          <button type="button" class="ghost" id="exportCsv">いまの名簿をCSVで保存</button>
        </div>
        <label>取り込み方法<select id="impMode">
          <option value="add">いまの名簿に追加する（同じ名前は重複させない）</option>
          <option value="replace">いまの名簿を全部消して入れ替える</option>
        </select></label>
        <label class="file">
          <span class="fake-btn">CSVファイルを選ぶ</span>
          <input type="file" id="csvFile" accept=".csv,text/csv" hidden>
        </label>
        <div id="impBox" hidden></div>
      </section>

    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script type="module" src="js/teams-page.js"></script>
</body>
</html>
